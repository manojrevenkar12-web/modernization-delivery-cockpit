[project]
name = "modernization-delivery-cockpit"
version = "0.1.0"
description = "A GenAI-era delivery cockpit for a legacy Java to MongoDB modernization: code-derived scope, behavioural parity, calibrated forecasts and evidence-based status."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = ["pymongo>=4.8", "mongomock>=4.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
